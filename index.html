<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Princesa y las Peonías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a3035; --deep:#9a5566; --gold:#c9a24a; --gold2:#e8cc84;
  --rose:#e8c3c0; --paper:#f8efe4; --paper2:#eddcc8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:#e9cfc8 radial-gradient(ellipse at 50% 40%, #fbf3ec 0%, #efd9d2 45%, #d2aca8 100%);
  font-family:'Cormorant Garamond', Georgia, serif; color:var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  user-select:none; -webkit-user-select:none;
}
.dust{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;
  background:#fff6de;box-shadow:0 0 8px 2px rgba(201,162,74,.7);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-105vh) translateX(40px);opacity:0}}

#holder{position:relative}
#stage{position:absolute;top:0;left:0;width:1100px;height:700px;transform-origin:0 0}
#book{position:absolute;inset:0;perspective:2800px;transition:transform 1s cubic-bezier(.645,.045,.355,1)}
#book.closed-front{transform:translateX(-275px)}
#book.closed-back{transform:translateX(275px)}

.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;
  transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.645,.045,.355,1);cursor:pointer}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{border-radius:4px 14px 14px 4px;box-shadow:6px 8px 26px rgba(120,60,60,.32)}
.face.back{transform:rotateY(180deg);border-radius:14px 4px 4px 14px;box-shadow:-6px 8px 26px rgba(120,60,60,.32)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.face.front::after{background:linear-gradient(to right, rgba(120,70,50,.22), rgba(120,70,50,0) 9%, rgba(0,0,0,0) 94%, rgba(120,70,50,.1))}
.face.back::after{background:linear-gradient(to left, rgba(120,70,50,.22), rgba(120,70,50,0) 9%, rgba(0,0,0,0) 94%, rgba(120,70,50,.1))}

.paper{background:
  radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.6), transparent 60%),
  radial-gradient(ellipse at 80% 90%, rgba(216,166,166,.25), transparent 55%),
  linear-gradient(135deg, var(--paper), var(--paper2));}

/* adornos rococó */
.rc{position:absolute;width:80px;height:80px;pointer-events:none;z-index:3}
.rc.tl{top:6px;left:6px}.rc.tr{top:6px;right:6px;transform:scaleX(-1)}
.rc.bl{bottom:6px;left:6px;transform:scaleY(-1)}.rc.br{bottom:6px;right:6px;transform:scale(-1)}
.crest{position:absolute;top:4px;left:50%;width:110px;height:50px;margin-left:-55px;z-index:3;pointer-events:none}

/* página de ilustración */
.pic{padding:32px}
.pic .frame{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;
  border:3px solid var(--gold);
  box-shadow:0 0 0 6px #f5e6dc, 0 0 0 8px var(--gold), 0 0 0 13px #efd3cf, inset 0 0 30px rgba(120,60,60,.2)}
.pic svg.scene{display:block;width:100%;height:100%}

/* página de texto */
.txt{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:54px 62px 60px;text-align:center}
.txt::before{content:"";position:absolute;inset:18px;border:4px double rgba(201,162,74,.8);border-radius:14px;pointer-events:none}
.txt .orn{font-size:30px;color:var(--deep);line-height:1;margin-bottom:10px;opacity:.85}
.verse{font-size:24px;line-height:1.4;font-weight:500}
.verse p{margin:0 0 12px}
.verse p:first-child::first-letter{font-family:'Pinyon Script',cursive;font-size:2.3em;color:var(--deep);line-height:.7;padding-right:3px}
.verse em{color:var(--deep)}
.txt .mini{margin-top:4px}
.pnum{position:absolute;bottom:28px;font-size:16px;color:#a07a6a;font-style:italic;z-index:4}
.front .pnum{right:50%;transform:translateX(50%)}.back .pnum{left:50%;transform:translateX(-50%)}
.fin{font-family:'Pinyon Script',cursive;font-size:54px;color:var(--deep);margin-top:0}
.dedic{font-size:26px;line-height:1.55;font-style:italic}
.dedic .to{font-family:'Pinyon Script',cursive;font-style:normal;font-size:64px;color:var(--deep);display:block;margin-bottom:6px}
.dedic .sign{display:block;margin-top:16px;font-size:28px;color:var(--deep)}

/* tapas: rosa palo con beige */
.cover{background:
  radial-gradient(circle at 15px 15px, rgba(255,255,255,.25) 2px, transparent 3px) 0 0/30px 30px,
  radial-gradient(ellipse at 50% 35%, #f6dfdb 0%, #e8c3bf 55%, #d6a8a6 100%);
  color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.cover::before{content:"";position:absolute;inset:20px;border:3px solid var(--gold);border-radius:14px;
  box-shadow:inset 0 0 0 6px #f3e6d4, inset 0 0 0 8px var(--gold)}
.cover .panel{position:relative;width:400px;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(180deg,#f8eee0,#ecdcc4);border:2px solid var(--gold);
  border-radius:50% 50% 42% 42% / 15% 15% 11% 11%;padding:36px 26px 30px;
  box-shadow:0 0 0 6px rgba(243,230,212,.8),0 0 0 8px rgba(201,162,74,.7),0 12px 30px rgba(120,60,60,.22)}
.cover .once{font-style:italic;font-size:21px;color:#8a6a5a}
.cover h1{font-family:'Pinyon Script',cursive;font-weight:400;font-size:62px;line-height:1.02;margin:4px 0 0;
  color:var(--deep);text-shadow:0 1px 0 #fff, 0 3px 8px rgba(201,162,74,.35)}
.cover .sub{font-size:23px;font-style:italic;color:#7a4a52;margin-top:4px}
.cover .medal{width:200px;height:200px;margin:6px 0}
.cover .press{margin-top:18px;font-size:17px;color:#7a4a52;animation:blink 2.4s ease-in-out infinite;position:relative}
@keyframes blink{50%{opacity:.35}}

/* controles */
#controls{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;z-index:50;
  font-size:17px;color:#7a4a52}
.btn{background:rgba(255,249,243,.85);color:var(--deep);border:1.5px solid var(--gold);border-radius:30px;
  padding:6px 16px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:background .2s}
.btn:hover{background:#f6dcdc}
.btn:disabled{opacity:.4}
#musicBtn{position:fixed;top:14px;right:16px;z-index:60;width:38px;height:38px;padding:0;border-radius:50%;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
#musicBtn.off{opacity:.55}
#musicBtn.off::after{content:"";position:absolute;width:24px;height:2px;background:var(--deep);transform:rotate(-45deg)}
.hint{font-style:italic}

/* intro */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, rgba(252,244,236,.98), rgba(226,190,186,.99));color:var(--deep);text-align:center;
  transition:opacity 1.2s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(48px,8vw,84px);margin:4px 0 0}
#intro p{font-style:italic;font-size:clamp(18px,2.6vw,23px);color:#7a4a52;margin:0 16px 26px}
#intro .btn{font-size:21px;padding:11px 30px}
#intro svg{width:110px;height:120px}
#rotate{display:none;position:fixed;top:14px;left:16px;right:80px;color:#7a4a52;font-style:italic;font-size:15px;z-index:60}
@media (orientation:landscape) and (max-height:520px){#rotate{display:block}}
#single{position:absolute;inset:0;perspective:2200px;display:none;cursor:pointer}
#spbox{position:fixed;z-index:55;top:10px;left:50%;transform:translateX(-50%);width:min(380px, calc(100vw - 32px));padding:6px;background:rgba(255,249,243,.94);border:1.5px solid var(--gold);border-radius:16px;box-shadow:0 6px 18px rgba(120,60,60,.2)}
#spbox iframe,#spplayer{display:block;width:100%;height:80px;border:0;border-radius:12px}
.spcap{font-size:15px;text-align:center;color:var(--deep);margin-top:4px;font-style:italic;font-weight:600}
body.sp #musicBtn{display:none}
.one #single{display:block}.one #book{display:none}
.spage{position:absolute;inset:0;transform-origin:left center}
.spage .face{transform:none!important;border-radius:6px 16px 16px 6px;box-shadow:6px 8px 24px rgba(120,60,60,.3)}
.spage .face::after{background:linear-gradient(to right, rgba(120,70,50,.2), rgba(120,70,50,0) 7%)!important}
.spage.out{animation:pgOut .6s ease-in forwards}
.spage.in{animation:pgIn .6s ease-out}
@keyframes pgOut{to{transform:rotateY(-100deg);opacity:.2}}
@keyframes pgIn{from{transform:rotateY(-100deg);opacity:.2}}
.one #controls{bottom:10px;gap:10px;font-size:15px}
.one .hint{max-width:58vw;text-align:center;line-height:1.2}

/* ==== animaciones de las ilustraciones ==== */
.drift{animation:drift 38s linear infinite}
@keyframes drift{from{transform:translateX(-150px)}to{transform:translateX(450px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.walk{animation:walk .8s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-1.5deg)}}
.twinkle,.sway,.swayB,.pulse,.peck,.fall,.spinc{transform-box:fill-box}
.twinkle{transform-origin:center;animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.floatUp{animation:floatUp 4s ease-out infinite}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
.fall{transform-origin:center;animation:fall 7s linear infinite}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translate(70px,560px) rotate(600deg);opacity:0}}
.sway{transform-origin:top center;animation:sway 3s ease-in-out infinite}
.swayB{transform-origin:bottom center;animation:sway 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.pulse{transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.peck{transform-origin:70% 90%;animation:peck 2.2s ease-in-out infinite}
@keyframes peck{0%,55%,100%{transform:rotate(0)}65%,85%{transform:rotate(28deg)}}
.fly{animation:fly 9s linear infinite}
@keyframes fly{0%{transform:translate(-90px,230px)}25%{transform:translate(70px,170px)}50%{transform:translate(200px,215px)}75%{transform:translate(330px,140px)}100%{transform:translate(500px,170px)}}
.jump{animation:jump 1.3s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}35%,55%{transform:translateY(-24px)}}
.shimmer{stroke-dasharray:12 28;animation:shimmer 2.5s linear infinite}
@keyframes shimmer{to{stroke-dashoffset:-80}}
.glow{animation:glow 2.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
.flutter{animation:flutter 7s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-30px)}50%{transform:translate(80px,5px)}75%{transform:translate(30px,25px)}}
.face:not(.live) *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}
</style>
</head>
<body>

<div class="dust" id="dust"></div>

<div id="intro">
  <svg viewBox="-40 -70 80 96"><g id="introTulip"></g></svg>
  <h2>Para Nicolle</h2>
  <p>Un pequeño cuento, hecho con mucho amor…</p>
  <button class="btn" id="openBtn">❦ Abrir el libro ❦</button>
</div>

<button class="btn" id="musicBtn" title="Música (M)" aria-label="Música">♪</button>
<div id="spbox" hidden><div id="spplayer"></div><div class="spcap" id="spcap">♪ Toca ▶ para escuchar nuestra canción</div></div>
<div id="rotate">Con el teléfono vertical se lee mejor ↻</div>

<div id="holder"><div id="stage"><div id="book" class="closed-front"></div><div id="single"></div></div></div>

<div id="controls">
  <button class="btn" id="prevBtn">◀</button>
  <span class="hint" id="hint">Usa las flechas ← → del teclado para pasar las páginas</span>
  <button class="btn" id="nextBtn">▶</button>
</div>

<!-- degradados y patrones compartidos por todas las ilustraciones -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gVG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1a45"/><stop offset=".45" stop-color="#1e3c86"/><stop offset=".8" stop-color="#2c5aa6"/><stop offset="1" stop-color="#3a6fb8"/></linearGradient>
    <mask id="crescent" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="#fff"/><circle cx=".8" cy=".32" r=".44" fill="#000"/></mask>
    <linearGradient id="gDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd3ef"/><stop offset=".65" stop-color="#d9effa"/><stop offset="1" stop-color="#fdf3d8"/></linearGradient>
    <linearGradient id="gDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a5e"/><stop offset=".5" stop-color="#7a5c9e"/><stop offset=".8" stop-color="#f0a38a"/><stop offset="1" stop-color="#f9d29d"/></linearGradient>
    <linearGradient id="gAutumn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7c98b"/><stop offset=".6" stop-color="#fbe2b6"/><stop offset="1" stop-color="#fff2d6"/></linearGradient>
    <linearGradient id="gSunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e4c8f"/><stop offset=".35" stop-color="#e0769a"/><stop offset=".6" stop-color="#f7a65f"/><stop offset="1" stop-color="#fbd98f"/></linearGradient>
    <radialGradient id="gLove" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fff0f2"/><stop offset=".6" stop-color="#fbd0d6"/><stop offset="1" stop-color="#f3b39a"/></radialGradient>
    <radialGradient id="gSun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c4"/><stop offset=".6" stop-color="#ffd66b"/><stop offset="1" stop-color="#ffb84d" stop-opacity="0"/></radialGradient>
    <radialGradient id="gMedal" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fbe3b0"/><stop offset=".75" stop-color="#e9c27a"/><stop offset="1" stop-color="#b8862e"/></radialGradient>
    <mask id="moonM"><rect width="400" height="510" fill="#fff"/><circle cx="92" cy="68" r="22" fill="#000"/></mask>
    <clipPath id="medClip"><circle r="96"/></clipPath>
    <pattern id="stone" width="80" height="120" patternUnits="userSpaceOnUse">
      <rect width="80" height="120" fill="#f4dfd9"/>
      <rect x="10" y="12" width="60" height="96" rx="10" fill="#f8e9e4" stroke="#d9b25a" stroke-width="2"/>
      <path d="M40 38 q-10 12 0 24 q10 -12 0 -24z" fill="#ecc6c2"/><circle cx="40" cy="80" r="3.5" fill="#e6bcb7"/>
      <path d="M26 50 q14 -8 28 0 M26 72 q14 8 28 0" stroke="#e6bcb7" stroke-width="1.5" fill="none"/>
    </pattern>
  </defs>
</svg>

<script>
/* =========================================================
   EL CUENTO — edita aquí los versos si quieres
   ========================================================= */
const VERSOS = [
`En un reino de colinas,
de molinos y neblinas,
en un castillo de piedra
abrazado por la hiedra,

vivía Nicolle, la princesa,
con su corona… y su tristeza.`,

`Llegaban los pretendientes
con cofres y con presentes,
con capas de terciopelo
y la nariz hasta el cielo.

«¡Cuánto oro! ¡Qué riqueza!»,
decían… sin ver a la princesa.

Y Nicolle, desde su almena,
suspiraba llena de pena:
«Ninguno me mira a mí…
solo el oro que hay aquí».`,

`Una noche, en su almohada,
soñó, medio ilusionada,
con un joven dibujado
a carboncillo, apenas trazado:
tenía sombrero y camisa…
pero ni rostro ni sonrisa.

«¿Quién eres?», preguntó bajito,
mirando el cielo infinito,
y las estrellas, en remolinos,
le susurraron: «Sigue tus caminos».`,

`Y antes del sol, muy temprano,
con su capa en la mano,
bajó por la escalera
de puntillas, sin que la vieran.

Cruzó el puente, cruzó el foso,
con el corazón nervioso:
«Por un día, sin corona,
seré una simple persona».`,

`En la plaza había de todo:
pan caliente, flores, lodo,
gallinas que cacareaban,
niños que reían y jugaban,

un juglar con su laúd
y aroma a campo y juventud.
Nicolle, con los ojos abiertos,
miraba todos los puestos.`,

`Junto a una vieja carreta
de peonías rosa y violeta,
un campesino sencillo
silbaba como un grillo.

Él no sabía quién era,
ni castillo ni bandera,
pero vio sus ojos cafés,
color de otoño… y después,

su corazón dio un brinco:
<em>¡uno, dos, tres, cuatro, cinco!</em>`,

`Juntó un ramo de peonías,
rosadas como sus mejillas,
y le dijo: «No tengo oro,
pero estas flores son mi tesoro».

Y Nicolle, sonrojada,
por primera vez fue mirada
no por su oro o su riqueza,
sino por su gentileza.

¡Y aquel boceto de su sueño
por fin tuvo rostro… y dueño!`,

`Se vieron al otro día,
y al otro… ¡qué alegría!
Paseaban junto al río,
bajo el sol y bajo el frío.

Él le hablaba de semillas;
ella, de mil maravillas.
Y aunque él nunca preguntó,
un día ella le contó:

«¡Soy princesa!». —«¿Y qué importa?
Mi amor por ti no se acorta».`,

`Pero un día, con tristeza,
él le dijo a la princesa:
«Debo irme a trabajar
a los campos, a sembrar,

lejos, tras el monte y el llano…
pero te llevo de la mano.
Mientras esta peonía florezca,
no habrá distancia que nos venza».

Nicolle guardó la flor
y le dijo: «Te espero, mi amor».`,

`Y cada día, sin falta,
una paloma volaba alta
sobre ríos y cabañas,
sobre bosques y montañas,

con una carta en su pata:
«Te pienso en cada fogata,
en cada estrella que brilla,
en cada nueva semilla».

Pasaron dos años enteros,
de nieves y de aguaceros,
pero el amor es un mago
que hace corto lo más largo,

¡y aquellos años de espera
fueron dos meses, de veras!`,

`Un día llegó un mensajero
con pergamino y sombrero:
«Tu tío abuelo, en su testamento,
te dejó un molino de viento,

tierras, trigo y un caballo…».
¡Y él saltó como un rayo!
«¡Ahora iré ante el rey
a pedir su mano, como manda la ley!»`,

`Ante el trono, con sombrero
en la mano, humilde y sincero,
dijo: «Majestad, le pido
la mano de quien he querido».

El rey rió: «¿Un molino?
¡Cien vinieron con oro fino!
¿Y tú, mi cabeza de pollo,
qué traes? ¿Otro embrollo?».

Pero Nicolle, al frente,
abrió un cofre, sonriente:
setecientas cartas de amor
y una peonía… su primera flor.`,

`El rey leyó, se secó un ojo,
se le puso el bigote rojo:
«Ay, mi cabeza de pollo…
Cien me trajeron riqueza;
tú me traes la certeza.
El oro se gasta y se va,
pero este amor… ¡quedará!».

Repicaron las campanas,
bailaron hasta las ranas,
y en el jardín del castillo
plantaron, con amor sencillo,
aquella primera peonía,
que hoy son mil… ¡y más cada día!`
];

const FINAL = `Y vivieron de la mano,
en invierno y en verano,
y aún hoy, cuando él la mira
a sus ojos de otoño, suspira…

y su corazón da un brinco:
<em>¡uno, dos, tres, cuatro, cinco!</em>`;

const DEDICATORIA = `<span class="to">Para Nicolle</span>
mi princesa de ojos color otoño.<br><br>
Cada peonía de este libro<br>es para ti.<br><br>
Con todo mi amor,
<span class="sign">— tu campesino ♥</span>`;

/* =========================================================
   PERSONAJES Y ELEMENTOS (SVG dibujado a mano)
   ========================================================= */
const HEART = "M0 4 C-10 -6 -18 2 -10 10 L0 18 L10 10 C18 2 10 -6 0 4Z";
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function mouth(m){
  if(m==='sad') return `<path d="M45 66 Q50 61.5 55 66" stroke="#9a4a47" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  if(m==='wow') return `<ellipse cx="50" cy="64.5" rx="2.6" ry="3.3" fill="#8a3a3a"/>`;
  if(m==='big') return `<path d="M44 62 Q50 71 56 62Z" fill="#8a3a3a"/><path d="M46.5 66.2 Q50 68.6 53.5 66.2" fill="#e77" />`;
  return `<path d="M45 63 Q50 67.5 55 63" stroke="#9a4a47" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;

}

const leaves = [];
for(let i=0;i<N;i++){ const leaf=document.createElement('div'); leaf.className='leaf'; book.appendChild(leaf); leaves.push(leaf); }
document.getElementById('introTulip').innerHTML = `<g class="swayB">${ramo(0,0,1)}</g>`;

/* =========================================================
   PASAR PÁGINAS
   Libro abierto (computador) o una página a la vez (celular).
   Solo las páginas cercanas tienen su dibujo cargado, para
   que el celular no se quede sin memoria.
   ========================================================= */
let single = null;   // true = modo celular
let cur = 0;         // hoja actual (libro abierto)
let pg = 0;          // página actual (modo celular)
const moving = new Map();
const $ = id => document.getElementById(id);

function fill(leaf,i,on){
  if(on && !leaf.dataset.on){ leaf.innerHTML = pages[2*i] + pages[2*i+1]; leaf.dataset.on = '1'; }
  else if(!on && leaf.dataset.on){ leaf.innerHTML = ''; delete leaf.dataset.on; }
}
function layoutBook(){
  let top = N + 10;
  leaves.forEach((l,i)=>{
    const mov = moving.has(l);
    const shown = mov || (i >= cur-2 && i <= cur+1);
    fill(l, i, mov || (i >= cur-3 && i <= cur+2));
    l.style.display = shown ? '' : 'none';
    l.classList.toggle('flipped', i < cur);
    l.style.zIndex = mov ? top++ : (i < cur ? i + 1 : N - i);
    if(l.dataset.on){
      l.querySelector('.front').classList.toggle('live', i === cur || mov);
      l.querySelector('.back').classList.toggle('live', i === cur - 1 || mov);
    }
  });
  book.className = cur === 0 ? 'closed-front' : cur === N ? 'closed-back' : '';
  $('prevBtn').disabled = cur === 0;
  $('nextBtn').disabled = cur === N;
}
function pageEl(p){
  const d = document.createElement('div'); d.className = 'spage'; d.innerHTML = pages[p];
  d.firstElementChild.classList.add('live'); return d;
}
function layoutSingle(){
  if(!one.firstChild) one.appendChild(pageEl(pg));
  $('prevBtn').disabled = pg === 0;
  $('nextBtn').disabled = pg === NP - 1;
}
const layout = () => single ? layoutSingle() : layoutBook();

function turn(dir){
  if(single){
    const np = pg + dir; if(np < 0 || np >= NP) return;
    const old = one.lastElementChild, nu = pageEl(np);
    if(dir > 0){ one.insertBefore(nu, old); old.classList.add('out'); setTimeout(()=>old.remove(), 650); }
    else { nu.classList.add('in'); one.appendChild(nu); setTimeout(()=>{ [...one.children].forEach(c=>{ if(c!==nu) c.remove(); }); nu.classList.remove('in'); }, 650); }
    while(one.children.length > 3) one.firstElementChild.remove();
    pg = np;
  } else {
    if(dir > 0 && cur >= N) return;
    if(dir < 0 && cur <= 0) return;
    const leaf = dir > 0 ? leaves[cur] : leaves[cur - 1];
    cur += dir;
    clearTimeout(moving.get(leaf));
    moving.set(leaf, setTimeout(()=>{ moving.delete(leaf); layout(); }, 1150));
  }
  layout();
  pageSound();
  $('hint').style.opacity = (single ? pg > 2 : cur > 1) ? .45 : 1;
}
function goTo(first){
  if(single){ pg = first ? 0 : NP - 1; one.innerHTML = ''; }
  else { moving.clear(); cur = first ? 0 : N; }
  layout();
}

document.addEventListener('keydown', e=>{
  if(!started) { if(['Enter',' ','ArrowRight'].includes(e.key)) { e.preventDefault(); openBook(); } return; }
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){ e.preventDefault(); turn(1); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); turn(-1); }
  else if(e.key==='Home') goTo(true);
  else if(e.key==='End') goTo(false);
  else if(e.key.toLowerCase()==='m') toggleMusic();
});
let swiped = false;
stage.addEventListener('click', e=>{
  if(swiped){ swiped = false; return; }
  const r = stage.getBoundingClientRect();
  if(single) return turn(e.clientX < r.left + r.width*0.3 ? -1 : 1);
  if(cur===0) return turn(1);
  if(cur===N) return turn(-1);
  turn(e.clientX > r.left + r.width/2 ? 1 : -1);
});
let tx=null, ty=null;
document.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e=>{
  if(tx===null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if(started && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ swiped = true; setTimeout(()=>swiped=false, 400); turn(dx < 0 ? 1 : -1); }
});
$('prevBtn').onclick = e=>{ e.stopPropagation(); turn(-1); };
$('nextBtn').onclick = e=>{ e.stopPropagation(); turn(1); };

const touch = matchMedia('(pointer:coarse)').matches;
if(touch){
  $('hint').textContent = 'Desliza o toca la página';
  pages[0] = pages[0].replace('Presiona → para abrir','Toca para abrir');
}

function fit(){
  const want = innerWidth < 760 || innerHeight < 520;
  if(want !== single){
    if(single !== null){ if(want) pg = cur === 0 ? 0 : Math.min(NP-1, 2*cur-1); else cur = Math.ceil(pg/2); }
    single = want;
    document.body.classList.toggle('one', single);
    one.innerHTML = ''; moving.clear();
    if(single) leaves.forEach((l,i)=>{ fill(l,i,false); l.style.display='none'; });
    layout();
  }
  const W = single ? 550 : 1100, reserve = single ? 84 : 110;
  const box = $('spbox'), resW = 0, resH = box.hidden ? 0 : box.offsetHeight + 16;
  const s = Math.min((innerWidth - 24 - resW) / W, (innerHeight - reserve - resH) / 700, 1.3);
  const h = $('holder');
  h.style.marginLeft = resW + 'px'; h.style.marginTop = resH + 'px';
  h.style.width = W*s + 'px'; h.style.height = 700*s + 'px';
  stage.style.width = W + 'px';
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* =========================================================
   MÚSICA
   Suena el MP3 que está junto a este HTML (instrumental de Adele).
   Si el archivo no se encuentra, suena una pieza romántica de piano de respaldo.
   ========================================================= */
const VOLUMEN = 0.22;
let ctx = null, started = false, musicOn = true, usingFile = false, synth = null;
const audio = new Audio(); audio.loop = true; audio.volume = VOLUMEN;

function ensureCtx(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }

function pageSound(){
  if(!ctx) return;
  const t = ctx.currentTime, len = .38;
  const buf = ctx.createBuffer(1, ctx.sampleRate*len, ctx.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 2);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8;
  f.frequency.setValueAtTime(900,t); f.frequency.linearRampToValueAtTime(2800,t+len);
  const g = ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.05); g.gain.exponentialRampToValueAtTime(.001,t+len);
  src.connect(f).connect(g).connect(ctx.destination); src.start(t);
}

function makeSynth(){
  // "Vals de las Peonías": pieza original para este libro.
  // Piano en arpegios + melodía + colchón de cuerdas, con reverberación de sala.
  const c = ensureCtx();
  const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
  comp.connect(c.destination);
  const master = c.createGain(); master.gain.value = 0; master.connect(comp);
  const rev = c.createConvolver(), rl = Math.floor(c.sampleRate*3.4), ir = c.createBuffer(2, rl, c.sampleRate);
  for(let ch=0; ch<2; ch++){ const d = ir.getChannelData(ch); for(let i=0;i<rl;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/rl, 2.8); }
  rev.buffer = ir;
  const wet = c.createGain(); wet.gain.value = .45; rev.connect(wet).connect(master);
  const dry = c.createGain(); dry.gain.value = .75; dry.connect(master);
  const bus = c.createBiquadFilter(); bus.type = 'lowpass'; bus.frequency.value = 3400;
  bus.connect(dry); bus.connect(rev);

  const midi = n => { const m = n.match(/([A-G])(#?)(\d)/); return 12*(+m[3]+1) + {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]?1:0); };
  const hz = (n, up=0) => 440*Math.pow(2,(midi(n)+up-69)/12);

  function piano(f, t, vol, len){
    const out = c.createGain();
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(vol, t + .01);
    out.gain.exponentialRampToValueAtTime(vol*.4, t + .4);
    out.gain.exponentialRampToValueAtTime(.0005, t + len);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(Math.min(6000, f*7), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(420, f*1.6), t + len);
    lp.connect(out).connect(bus);
    [[1,1],[2,.38],[3,.14],[4,.06]].forEach(([k,a])=>{
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f*k*(1 + (k-1)*.0007);
      const g = c.createGain(); g.gain.setValueAtTime(a, t); g.gain.exponentialRampToValueAtTime(a*.02 + .0001, t + len/k);
      o.connect(g).connect(lp); o.start(t); o.stop(t + len + .1);
    });
  }
  function pad(fs, t, dur, vol){
    const g = c.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur*.4);
    g.gain.linearRampToValueAtTime(vol*.75, t + dur*.85); g.gain.linearRampToValueAtTime(0, t + dur + 1.2);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 850;
    lp.connect(g).connect(bus);
    fs.forEach(f => [-6, 6].forEach(dt => {
      const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = dt;
      const og = c.createGain(); og.gain.value = .3; o.connect(og).connect(lp); o.start(t); o.stop(t + dur + 1.3);
    }));
  }

  // acordes: 8 notas de arpegio por compás (se tocan una octava más arriba)
  const ARP = {
    D:  ['D2','A2','D3','F#3','A3','F#3','D3','A2'],
    A:  ['A1','E2','A2','C#3','E3','C#3','A2','E2'],
    Ac: ['C#2','A2','C#3','E3','A3','E3','C#3','A2'],
    Bm: ['B1','F#2','B2','D3','F#3','D3','B2','F#2'],
    Fm: ['F#1','C#2','F#2','A2','C#3','A2','F#2','C#2'],
    Fa: ['A1','F#2','A2','C#3','F#3','C#3','A2','F#2'],
    G:  ['G1','D2','G2','B2','D3','B2','G2','D2'],
    Df: ['F#1','D2','F#2','A2','D3','A2','F#2','D2'],
    Em: ['E2','B2','E3','G3','B3','G3','E3','B2'],
    E7: ['E2','B2','D3','G3','B3','G3','D3','B2'],
    A7: ['A1','E2','A2','C#3','G3','C#3','A2','E2'],
  };
  const SONG = [
    ['D', ['F#5',2,'E5',1,'F#5',1]], ['Ac',['E5',3,'C#5',1]], ['Bm',['D5',2,'C#5',1,'D5',1]], ['Fa',['A4',4]],
    ['G', ['B4',2,'D5',1,'G5',1]],   ['Df',['F#5',2,'E5',1,'D5',1]], ['E7',['E5',2,'G5',1,'F#5',1]], ['A7',['E5',4]],
    ['D', ['A5',2,'F#5',1,'A5',1]],  ['Ac',['E5',2,'A5',2]], ['Bm',['F#5',2,'D5',1,'F#5',1]], ['Fa',['C#5',3,'A4',1]],
    ['G', ['B4',1,'D5',1,'G5',2]],   ['Df',['F#5',1,'A5',1,'A5',2]], ['E7',['G5',2,'E5',1,'C#5',1]], ['D',['D5',4]],
    ['G', ['D5',2,'G5',2]],          ['A', ['E5',2,'A5',2]], ['Fm',['F#5',3,'E5',1]], ['Bm',['D5',3,'B4',1]],
    ['Em',['E5',2,'G5',1,'B5',1]],   ['A', ['A5',3,'G5',1]], ['D', ['F#5',2,'E5',1,'D5',1]], ['D',['D5',4]],
  ];
  const beat = .82;
  const ev = [];
  SONG.forEach(([ch, mel], bar) => {
    const T = bar*4;
    ARP[ch].forEach((n,i) => ev.push({t:T + i*.5, k:'p', f:hz(n,12), v:i ? .1 : .15, len:2.4}));
    ev.push({t:T, k:'pad', fs:ARP[ch].slice(2,5).map(n=>hz(n)), v:.05, len:4*beat});
    let m = T; for(let i=0;i<mel.length;i+=2){ ev.push({t:m, k:'p', f:hz(mel[i]), v:.26, len:Math.max(2.4, mel[i+1]*beat*1.4)}); m += mel[i+1]; }
  });
  ev.sort((x,y)=>x.t-y.t);
  const loopLen = SONG.length*4;
  let startAt = 0, idx = 0, loop = 0, timer = null;
  function tick(){
    const ahead = c.currentTime + .5;
    while(true){
      const e = ev[idx], when = startAt + (loop*loopLen + e.t)*beat;
      if(when > ahead) break;
      if(when > c.currentTime - .05){
        if(e.k === 'pad') pad(e.fs, when, e.len, e.v); else piano(e.f, when, e.v, e.len);
      }
      if(++idx >= ev.length){ idx = 0; loop++; }
    }
  }
  return {
    start(){ master.gain.cancelScheduledValues(c.currentTime); master.gain.setTargetAtTime(VOLUMEN*1.5, c.currentTime, 1.2);
             if(!timer){ startAt = c.currentTime + .2; idx = 0; loop = 0; timer = setInterval(tick, 100); tick(); } },
    stop(){ master.gain.setTargetAtTime(0, c.currentTime, .3); const tm = timer; timer = null; setTimeout(()=>clearInterval(tm), 600); }
  };
}

const SP_ID = '6WK93ES8dqpgLSLNJq5wax';   // canción de Spotify (la usa la versión pública)
let useSP = !!SP_ID, sp = null, spReady = false, spWanted = false, spBegun = false;
function spFail(){
  if(!useSP) return;
  useSP = false; $('spbox').hidden = true; document.body.classList.remove('sp'); fit();
  if(started && musicOn) playMusic();
}
function loadSP(){
  if(!useSP) return;
  $('spbox').hidden = false; document.body.classList.add('sp'); fit();
  window.onSpotifyIframeApiReady = API => {
    API.createController($('spplayer'), { uri:'spotify:track:' + SP_ID, width:'100%', height:80 }, ctrl => {
      sp = ctrl;
      ctrl.addListener('ready', () => { spReady = true; fit(); if(spWanted) playMusic(); });
      ctrl.addListener('playback_update', e => {
        const d = e.data || {};
        if(!d.isPaused){ spBegun = true; $('spcap').hidden = true; fit(); }
        // al terminar, vuelve a empezar
        if(d.isPaused && spWanted && d.duration && d.position >= d.duration - 1200){ ctrl.seek(0); ctrl.resume(); }
      });
    });
  };
  const sc = document.createElement('script');
  sc.src = 'https://open.spotify.com/embed/iframe-api/v1'; sc.onerror = spFail;
  document.head.appendChild(sc);
  setTimeout(()=>{ if(useSP && !spReady) spFail(); }, 15000);
}
loadSP();

function playMusic(){
  if(useSP){
    spWanted = true;
    if(spReady){ spBegun ? sp.resume() : sp.play(); }
    return;
  }
  if(usingFile){
    audio.play().catch(()=>{ usingFile=false; playMusic(); });
  } else {
    if(!synth) synth = makeSynth();
    synth.start();
  }
}
function stopMusic(){ if(useSP){ spWanted = false; if(spReady) sp.pause(); return; } if(usingFile) audio.pause(); else if(synth) synth.stop(); }
audio.addEventListener('error', ()=>{ if(usingFile){ usingFile=false; if(started && musicOn) playMusic(); } });

function toggleMusic(){
  musicOn = !musicOn;
  document.getElementById('musicBtn').classList.toggle('off', !musicOn);
  musicOn ? playMusic() : stopMusic();
}
document.getElementById('musicBtn').onclick = e=>{ e.stopPropagation(); ensureCtx(); if(!started) return openBook(); toggleMusic(); };

function openBook(){
  if(started) return; started = true;
  ensureCtx();
  document.getElementById('intro').classList.add('gone');
  playMusic();
  setTimeout(()=>turn(1), 900);
}
document.getElementById('openBtn').onclick = openBook;

const jump = location.hash.match(/^#p(\d+)$/);
if(jump){ started = true; document.getElementById('intro').classList.add('gone');
  if(single){ pg = Math.min(NP-1, +jump[1]); one.innerHTML = ''; } else cur = Math.min(N, +jump[1]);
  layout(); }
